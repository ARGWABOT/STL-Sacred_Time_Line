name: "Something fails · Algo falla"
description: "Report a bug in STL Studio · Avisa una falla de STL Studio"
labels: ["falla"]
body:
  - type: markdown
    attributes:
      value: |
        STL Studio does not accept code changes from others, but bug reports are welcome. Four short questions.
        STL Studio no acepta cambios de código de otros, pero los avisos de fallas, sí. Cuatro preguntas cortas.
  - type: dropdown
    id: sistema
    attributes:
      label: "Your system · Tu sistema"
      options:
        - Windows
        - Mac
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Studio version · Versión del Studio"
      description: |
        In the Studio folder: `git log -1 --format="%h %cd" --date=short` (or the version in package.json, if you installed the package).
        En la carpeta del Studio: `git log -1 --format="%h %cd" --date=short` (o la versión de package.json, si instalaste el paquete).
    validations:
      required: true
  - type: textarea
    id: que-paso
    attributes:
      label: "What you did and what happened · Qué hiciste y qué pasó"
      description: "Step by step, and what you expected to see · Paso a paso, y lo que esperabas ver"
    validations:
      required: true
  - type: textarea
    id: revision
    attributes:
      label: "If a review failed: what «Qué pasó con la revisión» says · Si falló una revisión: lo que dice «Qué pasó con la revisión»"
      description: "In the Studio header, «¿Por qué?» opens it · En la cabecera del Studio, «¿Por qué?» lo abre"
    validations:
      required: false
